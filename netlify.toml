[build]
  publish = "."
  command = "node inject-env.js"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/cashier"
  to = "/cashier.html"
  status = 200

[[redirects]]
  from = "/captain"
  to = "/captain.html"
  status = 200

[[redirects]]
  from = "/driver"
  to = "/driver.html"
  status = 200

[[redirects]]
  from = "/super-admin*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/super*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/market"
  to = "/platform-menu.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https: https://fonts.googleapis.com https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src * 'self' https: wss: http: ws:; frame-ancestors 'self';"

[[headers]]
  for = "/bundle-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"